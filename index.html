<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F4F3EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="薄肌">
<meta name="description" content="薄肌 · 每日自律打卡：西语、机器学习、训练、饮食、长高">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<title>薄肌 · 自律打卡</title>
</head>
<body>

<!-- ================= 图标库 ================= -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></symbol>
  <symbol id="i-dumbbell" viewBox="0 0 24 24"><path d="M6.5 6.5v11M3.5 9v5M17.5 6.5v11M20.5 9v5M6.5 12h11"/></symbol>
  <symbol id="i-bowl" viewBox="0 0 24 24"><path d="M3 11h18a9 9 0 0 1-9 9 9 9 0 0 1-9-9z"/><path d="M8 7c0-2 1-2 1-4M13 7c0-2 1-2 1-4"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></symbol>
  <symbol id="i-lang" viewBox="0 0 24 24"><path d="M3 6h10M8 3v3M5 6c0 4 3 7 6 8M11 6c0 4-3 7-6 8"/><path d="M13 21l4-10 4 10M14.8 17h4.4"/></symbol>
  <symbol id="i-brain" viewBox="0 0 24 24"><path d="M9.5 3A3.5 3.5 0 0 0 6 6.5c-1.7.4-3 2-3 3.8 0 1.1.5 2.1 1.2 2.8A3.5 3.5 0 0 0 6 19.5 3.5 3.5 0 0 0 9.5 23"/><path d="M14.5 3A3.5 3.5 0 0 1 18 6.5c1.7.4 3 2 3 3.8 0 1.1-.5 2.1-1.2 2.8A3.5 3.5 0 0 1 18 19.5 3.5 3.5 0 0 1 14.5 23"/><path d="M12 2v20"/></symbol>
  <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 2.7 6.9 8.9a7 7 0 1 0 10.2 0z"/></symbol>
  <symbol id="i-stretch" viewBox="0 0 24 24"><circle cx="12" cy="4" r="2"/><path d="M12 7v6M12 13l-4 8M12 13l4 8M5 9l7 2 7-2"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 13a8.5 8.5 0 0 1-10-10 8.5 8.5 0 1 0 10 10z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5 9 17.5 20 6.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 4v16M16 4v16"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-fire" viewBox="0 0 24 24"><path d="M12 2s5 4.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 1-3.5S9 11 9 12a3 3 0 0 0 3 3"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-scale" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="4"/><path d="M8 10a4 4 0 0 1 8 0"/><path d="M12 10l2-2"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 3h9l5 5v13H5z"/><path d="M14 3v5h5M8 13h8M8 17h5"/></symbol>
</svg>

<div id="app">

  <!-- ================= 今日 ================= -->
  <section class="page" id="page-today"></section>

  <!-- ================= 课表 ================= -->
  <section class="page" id="page-schedule"></section>

  <!-- ================= 训练 ================= -->
  <section class="page" id="page-train"></section>

  <!-- ================= 饮食 ================= -->
  <section class="page" id="page-diet"></section>

  <!-- ================= 数据 ================= -->
  <section class="page" id="page-stats"></section>

  <!-- ================= 底部导航 ================= -->
  <nav class="tabbar" id="tabbar">
    <button class="tab is-active" data-tab="today">
      <svg class="ico"><use href="#i-home"/></svg><span>今日</span>
    </button>
    <button class="tab" data-tab="schedule">
      <svg class="ico"><use href="#i-calendar"/></svg><span>课表</span>
    </button>
    <button class="tab" data-tab="train">
      <svg class="ico"><use href="#i-dumbbell"/></svg><span>训练</span>
    </button>
    <button class="tab" data-tab="diet">
      <svg class="ico"><use href="#i-bowl"/></svg><span>饮食</span>
    </button>
    <button class="tab" data-tab="stats">
      <svg class="ico"><use href="#i-chart"/></svg><span>数据</span>
    </button>
  </nav>
</div>

<!-- ================= 计时器浮层 ================= -->
<div class="timer-sheet" id="timerSheet" aria-hidden="true">
  <div class="timer-card">
    <div class="timer-head">
      <span class="timer-label">机器学习 · 专注计时</span>
      <button class="icon-btn" id="timerClose" aria-label="关闭"><svg class="ico"><use href="#i-x"/></svg></button>
    </div>
    <div class="timer-ring">
      <svg viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="86" class="ring-bg"/>
        <circle cx="100" cy="100" r="86" class="ring-fg" id="ringFg"/>
      </svg>
      <div class="timer-mid">
        <div class="timer-time" id="timerTime">50:00</div>
        <div class="timer-sub" id="timerSub">今日累计 0 / 120 分钟</div>
      </div>
    </div>
    <div class="timer-modes" id="timerModes">
      <button data-min="50" class="is-on">50 分钟</button>
      <button data-min="25">25 分钟</button>
      <button data-min="15">15 分钟</button>
    </div>
    <div class="timer-actions">
      <button class="btn btn-ghost" id="timerReset"><svg class="ico"><use href="#i-reset"/></svg>重置</button>
      <button class="btn btn-primary" id="timerToggle"><svg class="ico"><use href="#i-play"/></svg>开始</button>
    </div>
    <p class="timer-tip">手机放远一点。这 50 分钟只做一件事。</p>
  </div>
</div>

<!-- ================= 通用弹窗 ================= -->
<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-card" id="sheetCard"></div>
</div>

<!-- ================= Toast ================= -->
<div class="toast" id="toast"></div>

<script>window.__errs=[];window.addEventListener("error",function(e){window.__errs.push(String(e.message))});</script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
